<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <title>Mandala astrológica com signos e decanatos</title>
  <desc>Mandala circular de 720 pixels, com faixa externa para os símbolos dos signos e faixa interna fina para marcação dos decanatos. Doze setores de 30 graus, com os limites dos signos deslocados 15 graus em relação aos eixos principais, de modo que os eixos atravessem o meio de cada setor.</desc>
  <g fill="none" stroke="#063160" stroke-width="1.25" stroke-linecap="round" transform="rotate(15 360 360)">
    <!-- Três círculos concêntricos: limites das duas faixas -->
    <circle cx="360" cy="360" r="350"/>
    <circle cx="360" cy="360" r="292"/>
    <circle cx="360" cy="360" r="270"/>

    <!-- Limites dos 12 signos: faixa externa e faixa de decanatos -->
    <g stroke-width="1.05">
      <path d="M360 10 L360 90" transform="rotate(0 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(30 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(60 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(90 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(120 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(150 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(180 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(210 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(240 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(270 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(300 360 360)"/>
      <path d="M360 10 L360 90" transform="rotate(330 360 360)"/>
    </g>

    <!-- Divisões dos decanatos: apenas na faixa interna (20 graus de largura) -->
    <g stroke-width="0.8" opacity="0.9">
      <path d="M360 68 L360 90" transform="rotate(10 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(20 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(40 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(50 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(70 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(80 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(100 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(110 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(130 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(140 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(160 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(170 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(190 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(200 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(220 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(230 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(250 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(260 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(280 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(290 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(310 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(320 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(340 360 360)"/>
      <path d="M360 68 L360 90" transform="rotate(350 360 360)"/>
    </g>
  </g>
</svg>
