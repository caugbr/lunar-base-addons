

<svg xmlns="http://www.w3.org/2000/svg" width="694" height="694" viewBox="0 0 694 694">
  <title>Mandala astrológica com signos e decanatos</title>
  <desc>Mandala circular de 690 pixels de diâmetro externo, com faixa externa para os símbolos dos signos e faixa interna fina para marcação dos decanatos. Doze setores de 30 graus, com os limites dos signos deslocados 15 graus em relação aos eixos principais, de modo que os eixos atravessem o meio de cada setor.</desc>
